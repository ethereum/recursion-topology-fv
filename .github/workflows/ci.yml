name: CI

# `lake build` + `#print axioms` + the repo-wide hygiene check (I4). No
# behavioural change is allowed to break these; every PR into `main` must pass them.

# `main` is the integration branch. `main-temp` is retained only so that any
# still-open branch targeting it keeps its gate; drop it once none remain.
on:
  push:
    branches: [main, main-temp]
  pull_request:
    branches: [main, main-temp]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cache the toolchain + the built oleans (Mathlib's dominate). Keyed on the
      # toolchain and dependency manifest so a bump correctly invalidates it; the
      # local recursion-topology-fv/* oleans still rebuild from the restored Mathlib cache.
      - name: Cache Lean toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      - name: Build default target
        run: lake build

      # The audit explicitly builds every discovered project module, including
      # files outside the umbrella import closure. One subsequent Lean invocation
      # loads Mathlib once and runs all semantic audits (I4).
      # --check-hygiene is the repo-wide "no sorry / no new axiom" gate; `lake build`
      # does NOT enforce it (sorry is a warning, an `axiom` decl compiles), and
      # --check-axioms only pins the listed headline theorems.
      - name: Audit — headline axioms + repo-wide hygiene (I4)
        run: >-
          python3 scripts/ci_checks.py
          --self-test
          --check-axioms
          --check-hygiene
